# Https lokalt. Läggs ovanpå compose.yaml och är inte ett driftmanifest.
#
#   ./dev/https-cert.sh
#   docker compose -f compose.yaml -f compose.https.yaml up -d --build
#
# Keycloak svarar då på https://localhost:8444 och utfärdaren blir
# https://localhost:8444/realms/recepta. Tillbaka till http: kör
# `docker compose up -d` utan den här filen.
services:
  keycloak:
    environment:
      KC_HTTPS_PORT: "8444"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/localhost.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/localhost.key
      KC_HOSTNAME: https://localhost:8444
      # Hälsokontrollen i compose.yaml talar vanlig http med port 9000.
      KC_HTTP_MANAGEMENT_SCHEME: http
      # Sajten körs också på https i det här läget.
      RECEPTA_WEB_URL: ${RECEPTA_WEB_HTTPS_URL:-https://localhost:3010}
    volumes:
      # Datorns utvecklingscertifikat för localhost, exporterat av dev/https-cert.sh.
      - ./certs:/opt/keycloak/certs:ro
    ports:
      # 8443 används av safeaid-keycloak.
      - "127.0.0.1:8444:8444"
      - "[::1]:8444:8444"

  dev-seed:
    environment:
      RECEPTA_WEB_URL: ${RECEPTA_WEB_HTTPS_URL:-https://localhost:3010}
