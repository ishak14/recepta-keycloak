# Lokal utveckling. Inte ett driftmanifest.
name: recepta-keycloak

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Saknas, kopiera .env.example till .env}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Ingen publicerad port: databasen nås bara inne i compose-nätet.

  keycloak:
    build: .
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Saknas, kopiera .env.example till .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Saknas, kopiera .env.example till .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Saknas, kopiera .env.example till .env}
      # Samma port inne i behållaren som utanför, och fast värdnamn, så att
      # utfärdaren alltid blir http://localhost:8081/realms/recepta (kontraktet).
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    ports:
      # Bara den här datorn. Hanteringsporten 9000 publiceras inte.
      - "127.0.0.1:8081:8081"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  keycloak-db:
