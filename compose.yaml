# Lokal utveckling. Inte ett driftmanifest.
name: recepta-keycloak

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Saknas, kopiera .env.example till .env}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Ingen publicerad port: databasen nås bara inne i compose-nätet.

  keycloak:
    build: .
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Saknas, kopiera .env.example till .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Saknas, kopiera .env.example till .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Saknas, kopiera .env.example till .env}
      # Samma port inne i behållaren som utanför, och fast värdnamn, så att
      # utfärdaren alltid blir http://localhost:8082/realms/recepta (kontraktet).
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8082"
      KC_HOSTNAME: http://localhost:8082
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      # Värden som realmfilen hämtar vid inläsning (${...} i realm/recepta-realm.json).
      RECEPTA_WEB_URL: ${RECEPTA_WEB_URL:-http://localhost:3010}
      RECEPTA_WEB_CLIENT_SECRET: ${RECEPTA_WEB_CLIENT_SECRET:?Saknas, kopiera .env.example till .env}
      BANKID_OIDC_ISSUER: ${BANKID_OIDC_ISSUER:-https://bankid-platshallare.invalid}
      BANKID_OIDC_AUTHORIZATION_URL: ${BANKID_OIDC_AUTHORIZATION_URL:-https://bankid-platshallare.invalid/authorize}
      BANKID_OIDC_TOKEN_URL: ${BANKID_OIDC_TOKEN_URL:-https://bankid-platshallare.invalid/token}
      BANKID_OIDC_JWKS_URL: ${BANKID_OIDC_JWKS_URL:-https://bankid-platshallare.invalid/jwks}
      BANKID_OIDC_CLIENT_ID: ${BANKID_OIDC_CLIENT_ID:-platshallare}
      BANKID_OIDC_CLIENT_SECRET: ${BANKID_OIDC_CLIENT_SECRET:-platshallare}
      BANKID_OIDC_CLAIM_PERSONAL_NUMBER: ${BANKID_OIDC_CLAIM_PERSONAL_NUMBER:-PLATSHALLARE}
    volumes:
      # Temat läses direkt från mappen så att ändringar syns utan ombyggnad.
      - ./themes/recepta:/opt/keycloak/themes/recepta:ro
    ports:
      # Bara den här datorn, både IPv4 och IPv6, så att "localhost" alltid
      # hamnar här. Hanteringsporten 9000 publiceras inte.
      - "127.0.0.1:8082:8082"
      - "[::1]:8082:8082"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  # BARA UTVECKLING: lägger in testanvändare när Keycloak är uppe och avslutas sedan.
  dev-seed:
    build: .
    entrypoint: ["/bin/bash", "/dev-seed/seed.sh"]
    restart: "no"
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8082
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Saknas, kopiera .env.example till .env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Saknas, kopiera .env.example till .env}
      # Sajtens adress. Realmfilen läses bara in när realmen saknas, så dev-seed
      # ser till att återanropen stämmer även i en databas som redan finns.
      RECEPTA_WEB_URL: ${RECEPTA_WEB_URL:-http://localhost:3010}
    volumes:
      - ./dev:/dev-seed:ro

volumes:
  keycloak-db:
